<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한장한장 · 카드뉴스 캐러셀 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;800&family=Noto+Serif+KR:wght@400;900&family=Jua&family=Do+Hyeon&family=Black+Han+Sans&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Gamja+Flower&family=Sunflower:wght@300;700&family=Hi+Melody&family=Dongle:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#fff;--card:#f2f2f3;--ink:#111;--sub:#8b8b90;--line:#e7e7ea;--surface:#fff;--soft:#f1f1f3;--outer:#e8e8ea;--panel:#29292b;--panel2:#3d3d40;--warn:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--card:#222225;--ink:#f2f2f3;--sub:#9a9aa0;--line:#2e2e32;--surface:#2b2b2e;--soft:#333337;--outer:#0c0c0d}}
:root[data-theme="dark"]{--bg:#161618;--card:#222225;--ink:#f2f2f3;--sub:#9a9aa0;--line:#2e2e32;--surface:#2b2b2e;--soft:#333337;--outer:#0c0c0d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--outer);font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
textarea,input{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid #3b6cff;outline-offset:2px}
svg{display:block}
#app{max-width:560px;margin:0 auto;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.on{display:flex}
/* home */
.hhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-style:normal;font-size:15px}
.more{width:40px;height:40px;border-radius:50%;font-size:22px;color:#777}
.hscroll{flex:1;overflow:auto;padding-bottom:110px}
.card{background:var(--card);border-radius:28px;margin:10px 16px;padding:24px 20px}
.newc{display:block;width:calc(100% - 32px);text-align:center}
.tiles{display:flex;justify-content:center;gap:12px;align-items:center;margin-bottom:18px}
.tiles span{width:52px;height:68px;border-radius:14px;background:var(--soft)}
.tiles b{width:66px;height:86px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font-size:36px;font-weight:300;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ct{font-size:21px;font-weight:800;letter-spacing:-.02em}
.cs{color:var(--sub);margin-top:6px;font-size:15px}
.rlist{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px}
.ritem{flex:none;width:118px;text-align:left;position:relative}
.ritem img{width:118px;height:148px;object-fit:cover;border-radius:14px;background:#ddd;display:block}
.ritem b{display:block;font-size:14px;margin-top:8px}
.ritem small{color:var(--sub);font-size:12px}
.ritem .rdel{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cl{color:var(--sub);font-size:15px}
.tbtn{background:var(--surface);border-radius:20px;padding:9px 16px;font-weight:600;font-size:15px}
.tplrow{display:flex;gap:10px;overflow-x:auto}
.tplrow button{flex:none;text-align:center;font-size:13px;color:#555}
.tplrow canvas{width:96px;height:120px;border-radius:12px;display:block;margin-bottom:6px}
.fabnew{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);border-radius:30px;padding:16px 28px;font-weight:800;font-size:18px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
/* editor */
.etop{display:flex;align-items:center;gap:8px;padding:10px 14px}
.etop .sp{flex:1}
.cbtn{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.1);display:grid;place-items:center;flex:none}
.cbtn.dark{background:var(--ink);color:var(--bg)}
.cbtn:disabled{opacity:.35}
.pill{display:flex;align-items:center;background:var(--surface);color:var(--ink);border-radius:24px;box-shadow:0 1px 5px rgba(0,0,0,.1);height:46px;padding:0 6px}
.pill button{width:42px;height:42px;display:grid;place-items:center}
.pill button:disabled{opacity:.3}
.pill i{width:1px;height:20px;background:#ddd}
#stagewrap{flex:1;min-height:160px;position:relative;margin:2px 12px 0;background:var(--surface);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px var(--line) inset}
#stage{position:relative;touch-action:none}
#cv{display:block;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#selbox{position:absolute;display:none;pointer-events:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
#selbox .hd{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #111;pointer-events:auto;touch-action:none}
#selbox .hr{right:-13px;bottom:-13px}
#selbox .ht{left:50%;top:-44px;margin-left:-12px;display:grid;place-items:center;font-size:12px}
#selbox .ht::after{content:"";position:absolute;left:9px;top:22px;width:2px;height:20px;background:#fff}
#warnbar{position:absolute;left:12px;right:12px;top:10px;display:none;align-items:center;gap:8px;background:var(--warn);color:#fff;border-radius:14px;padding:8px 10px 8px 14px;font-size:13px;font-weight:600;z-index:3}
#warnbar.on{display:flex}
#warnbar span{flex:1}
#warnbar button{background:#fff;color:var(--warn);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.82);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;display:none;z-index:2;white-space:nowrap}
#hint.on{display:block}
.panel{display:none;margin:8px 12px 0;background:var(--panel);color:#fff;border-radius:24px;padding:12px 16px 14px;max-height:31vh;overflow:auto;-webkit-overflow-scrolling:touch}
.panel.on{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ptitle{color:#bdbdc2;font-size:14px}
.px{width:34px;height:34px;border-radius:50%;background:var(--panel2);color:#fff;font-size:15px}
.pgrp{margin:6px 0 10px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#cfcfd4;margin-bottom:6px}
.pval{font-weight:800;color:#fff;font-size:16px}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#5a5a5e}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.rng::-moz-range-track{height:4px;background:#5a5a5e}
.rng::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;background:var(--panel2);color:#fff;border-radius:20px;padding:9px 15px;font-size:15px;white-space:nowrap}
.chip.on{background:#fff;color:#111}
.chip.add{background:#4b4b4f}
.chip.warn{background:var(--warn)}
.sws{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 8px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
.sw.on{outline:3px solid #fff;outline-offset:2px}
.sw.none{background:linear-gradient(135deg,#fff 45%,#e5484d 46%,#e5484d 54%,#fff 55%)}
.swc{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.swc::-webkit-color-swatch-wrapper{padding:0}
.swc::-webkit-color-swatch{border:0;border-radius:50%;opacity:0}
.pnote{color:#b5b5ba;font-size:13px;line-height:1.5;margin:4px 0 8px}
.pta{width:100%;border:0;border-radius:14px;padding:12px;font-size:17px;background:#fff;color:#111;resize:vertical;min-height:70px}
.pin{width:100%;border:0;border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:#111}
.tgl{display:flex;align-items:center;gap:12px;margin:8px 0 10px;cursor:pointer}
.tgl input{display:none}
.tsw{flex:none;width:52px;height:32px;border-radius:16px;background:#5a5a5e;position:relative;transition:background .15s}
.tsw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked+.tsw{background:#34c759}
.tgl input:checked+.tsw::after{transform:translateX(20px)}
.ttxt b{display:block;font-size:15px}
.ttxt small{display:block;color:#b5b5ba;font-size:13px;line-height:1.45;margin-top:2px}
.grid9{display:grid;grid-template-columns:repeat(3,52px);gap:8px;margin:6px 0 10px}
.grid9 button{height:44px;border-radius:12px;background:var(--panel2);color:#fff;font-size:18px}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.emogrid.wide{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.emogrid button{background:var(--panel2);border-radius:12px;min-height:46px;padding:6px;color:#fff;font-family:"Noto Sans KR",sans-serif;font-size:18px}
.strip{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
#pages{flex:1;display:flex;align-items:center;gap:10px;overflow-x:auto;min-width:0;padding:4px 2px}
.pth{flex:none;position:relative;border-radius:12px;padding:3px;border:2.5px solid transparent}
.pth.on{border-color:var(--ink)}
.pth canvas{display:block;width:46px;border-radius:7px}
.pnum{position:absolute;right:-4px;bottom:-4px;background:#111;color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.padd{flex:none;width:52px;height:60px;border-radius:12px;border:2px dashed #c9c9ce;color:#888;font-size:24px}
.paddl{flex:none;color:#999;font-size:14px;white-space:nowrap}
.fab{display:flex;gap:8px;flex:none}
.fab button{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12);display:grid;place-items:center}
.fab button.dark{background:var(--ink);color:var(--bg)}
.fab .sel{display:none}
.fab.has .sel{display:grid}
#tools{display:flex;gap:4px;overflow-x:auto;padding:6px 10px 2px;border-top:1px solid var(--line)}
.tool{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.tic{width:50px;height:50px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:19px;font-weight:700}
.tool.on .tic{background:var(--ink);color:var(--bg)}
.tlab{font-size:12.5px;color:var(--sub);white-space:nowrap}
.tool.on .tlab{color:var(--ink);font-weight:700}
#tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 10px 10px;border-top:1px solid var(--line)}
.tab{flex:none;padding:10px 13px;font-size:17px;color:#999;position:relative}
.tab.on{color:var(--ink);font-weight:800}
.tab.on::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--ink)}
/* sheets */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;border-radius:0}
.sheet.on{display:flex}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.shead b{font-size:26px;font-weight:800;letter-spacing:-.03em}
.btabs{display:flex;gap:8px;padding:6px 18px 10px;overflow-x:auto}
.btab{flex:none;padding:11px 18px;border-radius:24px;background:var(--soft);font-size:16px;font-weight:600}
.btab.on{background:var(--ink);color:var(--bg)}
.bbody{flex:1;overflow:auto;padding:4px 16px 40px}
.bcat{color:var(--sub);font-size:15px;margin:16px 4px 10px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stile{background:var(--card);border-radius:20px;padding:10px 10px 12px;text-align:left}
.stile canvas{width:100%;border-radius:14px;display:block}
.sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:0 4px;font-size:15px}
.bm{width:30px;height:30px;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.ptile{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ptop b{font-size:20px;font-weight:800}
.prev3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;color:#aaa;font-size:14px}
.prev3 canvas{width:100%;border-radius:12px;display:block;margin-bottom:6px}
.ptile .use{width:100%;margin-top:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;font-weight:700}
/* feed */
.fpost{background:var(--card);border-radius:18px;overflow:hidden;margin-top:6px}
.fhead{display:flex;align-items:center;gap:10px;padding:12px}
.fav{width:34px;height:34px;border-radius:50%;background:conic-gradient(#ffb347,#ff4f8b,#a78bfa,#5ce1e6,#ffb347);padding:2px}
.fav i{display:block;width:100%;height:100%;border-radius:50%;background:#ddd;border:2px solid #fff}
.fname{font-weight:700;flex:1}
.fcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.fcar img{flex:none;width:100%;scroll-snap-align:center;display:block}
.fdots{display:flex;justify-content:center;gap:5px;padding:10px}
.fdots i{width:6px;height:6px;border-radius:50%;background:#ccc}
.fdots i.on{background:#3b6cff}
.ficons{display:flex;gap:16px;padding:0 14px;font-size:24px}
.fcap{padding:8px 14px 16px;font-size:14px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:8px}
.fgrid div{aspect-ratio:3/4;background:var(--soft);overflow:hidden}
.fgrid img{width:100%;height:100%;object-fit:cover;display:block}
.fnote{color:var(--sub);font-size:13px;margin:10px 4px;line-height:1.5}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xgrid img{width:100%;border-radius:10px;display:block;background:#ddd}
.bigbtn{display:block;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:15px;font-size:17px;font-weight:700;margin-top:10px}
.bigbtn.light{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.amenu{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-end}
.amenu.on{display:flex}
.amenu .box{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.amenu .box b{display:block;font-size:18px;margin:0 4px 6px}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,.88);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.pgrid{display:grid;gap:12px}
.pgrid .ptile{margin-bottom:0}
@media (min-width:760px){
#app{max-width:none}
.hscroll{display:grid;grid-template-columns:1fr 1fr;align-content:start;max-width:1200px;width:100%;margin:0 auto;padding:0 8px 120px}
.newc{width:auto;grid-column:1}
#hResume{grid-column:2}
#hResume:empty{display:none}
#tplCard{grid-column:1/-1}
.tplrow canvas{width:132px;height:165px}
.bbody{padding:4px 28px 40px}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.fpost,.fgrid{max-width:520px;margin-left:auto;margin-right:auto}
.fnote{text-align:center}
.xgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.bigbtn{max-width:480px;margin-left:auto;margin-right:auto}
.amenu{align-items:center;justify-content:center}
.amenu .box{max-width:460px;border-radius:24px}
.shead,.btabs{padding-left:28px;padding-right:28px}
.hscroll:has(#hResume:empty) .newc{grid-column:1/-1}
}
@media (min-width:760px) and (orientation:landscape){
#editor.view.on{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto auto minmax(0,1fr);grid-template-areas:"top top" "stage strip" "stage tabs" "stage tools" "stage panel"}
.etop{grid-area:top}
#stagewrap{grid-area:stage;margin:0 4px 14px 14px;min-height:0}
.strip{grid-area:strip;padding:4px 14px 8px}
#tabs{grid-area:tabs;flex-wrap:wrap;border-top:0;padding:4px 10px 6px}
#tools{grid-area:tools;flex-wrap:wrap;overflow:visible;border-top:1px solid var(--line);padding:10px 10px 4px}
.tool{width:76px}
#panel{grid-area:panel;max-height:none;margin:8px 14px 14px;align-self:start;overflow:auto}
#panel.on{max-height:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">

<section id="home" class="view on">
  <div class="hhead"><div class="logo"><i>한</i>한장한장</div><button class="more" id="hMore" aria-label="설정">⋯</button></div>
  <div class="hscroll">
    <button class="card newc" id="hNew"><div class="tiles"><span></span><b>＋</b><span></span></div><div class="ct">새 캐러셀</div><div class="cs">사진을 고르면 바로 시작해요</div></button>
    <div id="hResume"></div>
    <div class="card" id="tplCard"><div class="trow"><span class="cl">템플릿</span><button class="tbtn" id="hBrowse">찾아보기</button></div><div class="tplrow" id="hTpl"></div></div>
  </div>
  <button class="fabnew" id="hNew2">＋ 새 캐러셀</button>
</section>

<section id="editor" class="view">
  <div class="etop">
    <button class="cbtn" id="bClose" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="sp"></div>
    <div class="pill"><button id="bUndo" aria-label="되돌리기"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L4 9l4 4"/><path d="M4 9h9a5 5 0 010 10h-3"/></svg></button><i></i><button id="bRedo" aria-label="다시하기"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l4 4-4 4"/><path d="M18 9H9a5 5 0 000 10h3"/></svg></button></div>

function loadImg(id){if(IMG[id]||!ASSETS[id])return;const im=new Image();im.onload=()=>{IMG[id]=im;dirty(true)};im.src=ASSETS[id]}
function addAsset(data){const id='a'+uid();ASSETS[id]=data;loadImg(id);return id}
function fileToData(file,max=2160,png=false){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=mk(im.naturalWidth*sc,im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.92))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('사진을 읽지 못했어요'))};im.src=u})}
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res([...i.files]);i.remove()};i.click()})}

function blurCv(src,r){const w=src.width,hh=src.height,o=mk(w,hh),ox=o.getContext('2d');if(r<1){ox.drawImage(src,0,0);return o}

  let a=mk(sw,sh);const ax=a.getContext('2d');ax.imageSmoothingQuality='high';ax.drawImage(c,0,0,sw,sh);
  while(a.width*2<w){const n=mk(a.width*2,a.height*2),nx=n.getContext('2d');nx.imageSmoothingQuality='high';nx.drawImage(a,0,0,n.width,n.height);a=n}
  ox.imageSmoothingQuality='high';ox.drawImage(a,0,0,w,hh);return o}
function drawPhoto(x,pg,img,hh){const iw=img.naturalWidth,ih=img.naturalHeight;const r90=(pg.rot90/90)%2===1;const bw=r90?ih:iw,bh=r90?iw:ih;const res=Math.abs(pg.rotF||0)*Math.PI/180;
  let sc=Math.max(W/bw,hh/bh)*pg.fit.scale*(1+Math.sin(res)*1.25);
  x.save();x.translate(W/2+pg.fit.x,hh/2+pg.fit.y);x.rotate(((pg.rot90||0)+(pg.rotF||0))*Math.PI/180);x.drawImage(img,-iw*sc/2,-ih*sc/2,iw*sc,ih*sc);x.restore()}

  const c=mk(W*s,hh*s),x=c.getContext('2d');x.scale(s,s);x.fillStyle=pg.bg||'#8c8c8c';x.fillRect(0,0,W,hh);
  const img=pg.photo&&IMG[pg.photo];
  if(img){if(pg.blur>0){const t=mk(W*s,hh*s),tx=t.getContext('2d');tx.scale(s,s);drawPhoto(tx,pg,img,hh);x.drawImage(blurCv(t,pg.blur*.5*s),0,0,W,hh)}else drawPhoto(x,pg,img,hh)}
  if(pg.bright){x.fillStyle=pg.bright>0?`rgba(255,255,255,${pg.bright/100*.55})`:`rgba(0,0,0,${-pg.bright/100*.7})`;x.fillRect(0,0,W,hh)}

    for(const st of pg.mask){mx.globalCompositeOperation=st.e?'destination-out':'source-over';mx.strokeStyle='#000';mx.lineWidth=st.r*2;mx.beginPath();st.p.forEach((p,i)=>i?mx.lineTo(p[0],p[1]):mx.moveTo(p[0],p[1]));if(st.p.length===1)mx.lineTo(st.p[0][0]+.5,st.p[0][1]);mx.stroke()}
    const b=blurCv(c,30*s);const bx=b.getContext('2d');bx.globalCompositeOperation='destination-in';bx.drawImage(m,0,0);x.drawImage(b,0,0,W,hh)}
  if(pg.grad&&pg.grad.type!=='none'){const col=pg.grad.type==='white'?'255,255,255':'0,0,0';const g=x.createLinearGradient(0,hh*.3,0,hh);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(1,`rgba(${col},${pg.grad.amt})`);x.fillStyle=g;x.fillRect(0,0,W,hh)}

const baseCache=new Map();

function drawSticker(x,el,I){const img=IMG[el.src];const w=el.w,hh=img?w*img.naturalHeight/img.naturalWidth:w;el._w=w;el._h=hh;if(!img){x.fillStyle='rgba(255,255,255,.3)';x.fillRect(-w/2,-hh/2,w,hh);return}if(el.shadow>0)setSh(x,{shadow:el.shadow,size:w/4},I);x.drawImage(img,-w/2,-hh/2,w,hh);clrSh(x)}
function drawBrush(x,el,I){el._w=el.bw;el._h=el.bh;const t=(el.text||'글')+' ';needFont(el.font,el.weight,t);x.font=`${el.weight} ${el.size}px ${FF(el.font)}`;x.textBaseline='middle';x.textAlign='center';
  const chars=Array.from(t),cw=ch=>x.measureText(ch).width,gap=el.size*.04,pts=el.pts,place=[];let ci=0,need=cw(chars[0])/2;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(!len)continue;const an=Math.atan2(dy,dx);let d=need;while(d<=len){const ch=chars[ci%chars.length];place.push([a[0]+dx*d/len,a[1]+dy*d/len,an,ch]);d+=cw(ch)/2+cw(chars[(ci+1)%chars.length])/2+gap;ci++}need=d-len}

function pushOut(el,pi){const hh=H();for(let it=0;it<5;it++){const zs=zones(pi),b=aabb(el),z=zs.find(z=>hitZ(b,z));if(!z)return;
  const c=[[z.x-b.r-10,0],[z.x+z.w-b.l+10,0],[0,z.y-b.b-10],[0,z.y+z.h-b.t+10]].filter(([dx,dy])=>b.l+dx>=0&&b.r+dx<=W&&b.t+dy>=0&&b.b+dy<=hh).sort((p,q)=>Math.hypot(...p)-Math.hypot(...q));if(!c.length)return;el.x+=c[0][0];el.y+=c[0][1]}}

  const bad=ST.safe!=='off'&&ST.warn?overlapped(cur):[];
  for(const el of bad){const b=aabb(el);x.strokeStyle='#e5484d';x.lineWidth=4/K;x.setLineDash([]);x.strokeRect(b.l,b.t,b.r-b.l,b.b-b.t)}

  if(BRP&&BRP.length>1){x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=BR.size*.5;x.lineCap='round';x.lineJoin='round';x.beginPath();BRP.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()}}

const snap=()=>JSON.stringify({ratio:P.ratio,pages:P.pages,globals:P.globals},(k,v)=>k==='_w'||k==='_h'?undefined:v);
function commit(now){clearTimeout(_ct);const f=()=>{if(!P)return;const s=snap();if(HIST[HIST.length-1]!==s){HIST.push(s);if(HIST.length>80)HIST.shift();FUT=[];updUndo();scheduleSave()}};now?f():(_ct=setTimeout(f,350))}

const PT=new Map();let G=null,lastTap={};
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/K,(e.clientY-r.top)/K]}
function hitTest(p){const list=allEls().slice().reverse();for(const el of list){if(!el._w)continue;const a=-(el.rot||0)*Math.PI/180,dx=p[0]-el.x,dy=p[1]-el.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=el._w/2+14&&Math.abs(ly)<=el._h/2+14)return el}return null}
function scSnap(el){return JSON.parse(JSON.stringify({size:el.size,w:el.w,pts:el.pts,bw:el.bw,bh:el.bh,sp:el.sp,box:el.box,stroke:el.stroke}))}
function applyScale(el,s,f){f=clamp(f,.08,12);if(el.type==='text'){el.size=clamp(s.size*f,8,700);el.sp.px=s.sp.px*f;el.sp.py=s.sp.py*f;el.sp.ty=s.sp.ty*f;el.box.radius=s.box.radius*f;el.box.bw=s.box.bw*f;el.stroke=s.stroke*f}else if(el.type==='sticker')el.w=clamp(s.w*f,20,4000);else if(el.type==='brush'){el.size=clamp(s.size*f,6,600);el.pts=s.pts.map(p=>[p[0]*f,p[1]*f]);el.bw=s.bw*f;el.bh=s.bh*f;el.stroke=s.stroke*f}}
function onDown(e){if(!P||ANIM)return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);PT.set(e.pointerId,p);const pg=curPg();
  if(PT.size===2){const[a,b]=[...PT.values()],el=selEl();if(mode==='crop')G={t:'zoom',d0:dist(a,b),s0:pg.fit.scale};else if(mode==='normal'&&el)G={t:'pinch',d0:dist(a,b),a0:ang(a,b),snap:scSnap(el),r0:el.rot||0};return}
  if(PT.size>2)return;
  if(mode==='crop'){G={t:'pan',p0:p,x0:pg.fit.x,y0:pg.fit.y};return}
  if(mode==='mask'){pg.mask.push({p:[p],r:MASK.r,e:MASK.erase});pg.maskV++;G={t:'mask'};dirty();return}
  if(mode==='brush'){BRP=[p];G={t:'brush'};dirty();return}
  const el=hitTest(p);
  if(el){const now=Date.now();if(lastTap.id===el.id&&now-lastTap.t<330){lastTap={};setSel(el.id);openTool('content','내용');G=null;return}lastTap={id:el.id,t:now};setSel(el.id);G={t:'move',dx:el.x-p[0],dy:el.y-p[1],moved:false}}
  else{setSel(null);G=null}}
function onMove(e){if(!PT.has(e.pointerId))return;const p=pos(e);PT.set(e.pointerId,p);if(!G)return;const pg=curPg(),el=selEl();
  switch(G.t){case'move':if(!el)return;el.x=p[0]+G.dx;el.y=p[1]+G.dy;G.moved=true;break;
  case'pinch':{if(!el||PT.size<2)return;const[a,b]=[...PT.values()];applyScale(el,G.snap,dist(a,b)/G.d0);el.rot=G.r0+(ang(a,b)-G.a0)*180/Math.PI;break}
  case'pan':pg.fit.x=G.x0+p[0]-G.p0[0];pg.fit.y=G.y0+p[1]-G.p0[1];break;
  case'zoom':{if(PT.size<2)return;const[a,b]=[...PT.values()];pg.fit.scale=clamp(G.s0*dist(a,b)/G.d0,1,5);break}
  case'mask':{const st=pg.mask[pg.mask.length-1],l=st.p[st.p.length-1];if(dist(l,p)>4){st.p.push(p);pg.maskV++}break}
  case'brush':{const l=BRP[BRP.length-1];if(dist(l,p)>5)BRP.push(p);break}
  case'scale':if(el)applyScale(el,G.snap,dist(G.c,p)/G.d0);break;
  case'rot':{if(!el)return;let r=G.r0+(ang(G.c,p)-G.a0)*180/Math.PI;r=((r%360)+540)%360-180;for(const s of[-180,-90,0,90,180])if(Math.abs(r-s)<4)r=s;el.rot=r;break}}
  dirty(G.t!=='brush')}
function onUp(e){if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);if(!G)return;if(G.t==='pinch'||G.t==='zoom'){if(PT.size)return}
  const el=selEl();if(G.t==='brush'){if(BRP&&BRP.length>2)makeBrush(BRP);BRP=null}
  if(el&&['move','pinch','scale','rot'].includes(G.t)&&(G.t!=='move'||G.moved)&&ST.push&&ST.safe!=='off')pushOut(el,cur);
  if(G.t!=='move'||G.moved)commit(true);if(tool&&['size','rot'].includes(tool))buildPanel();G=null;dirty(true)}
stage.addEventListener('pointerdown',onDown);stage.addEventListener('pointermove',onMove);stage.addEventListener('pointerup',onUp);stage.addEventListener('pointercancel',onUp);
for(const hd of document.querySelectorAll('#selbox .hd')){hd.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();const el=selEl();if(!el)return;try{hd.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);PT.set(e.pointerId,p);const c=[el.x,el.y];G=hd.classList.contains('hr')?{t:'scale',c,d0:Math.max(10,dist(c,p)),snap:scSnap(el)}:{t:'rot',c,a0:ang(c,p),r0:el.rot||0}});hd.addEventListener('pointermove',onMove);hd.addEventListener('pointerup',onUp);hd.addEventListener('pointercancel',onUp)}
function makeBrush(raw){const xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]),l=Math.min(...xs),r=Math.max(...xs),t=Math.min(...ys),b=Math.max(...ys),cx=(l+r)/2,cy=(t+b)/2;
  const el={id:uid(),type:'brush',x:cx,y:cy,rot:0,pts:raw.map(p=>[p[0]-cx,p[1]-cy]),bw:r-l+BR.size,bh:b-t+BR.size,text:BR.text||ST.account,font:BR.font,size:BR.size,color:BR.color,weight:BR.weight,stroke:BR.stroke,strokeColor:BR.strokeColor};curPg().elements.push(el);selId=el.id;commit(true)}

  const add=h('button','padd','＋');add.setAttribute('aria-label','페이지 추가');add.onclick=addPageMenu;w.append(add);if(P.pages.length<4)w.append(h('span','paddl','페이지 추가'));thumbsNow()}

function addPageMenu(){menu('페이지 추가',[['사진으로 추가',async()=>{const fs=await pickFiles('image/*',true);if(!fs.length)return;for(const f of fs){try{P.pages.splice(cur+1,0,newPage(addAsset(await fileToData(f))));cur++}catch(e){toast(e.message)}}afterPages()}],['빈 페이지 추가',()=>{const pg=newPage();P.pages.splice(cur+1,0,pg);cur++;afterPages()}],['지금 페이지 복제',dupPage]])}

async function loadFont(el){const fs=await pickFiles('.ttf,.otf,.woff,.woff2',false);if(!fs.length)return;const f=fs[0];const name=f.name.replace(/\.[^.]+$/,'');try{const buf=await f.arrayBuffer();await addFontFace(name,buf);try{await tx('fonts','readwrite',s=>s.put({name,buf}))}catch(_){}el.font=name;buildPanel();dirty(true);commit(true);toast(`'${name}' 글꼴을 넣었어요`)}catch(e){toast('글꼴 파일을 읽지 못했어요')}}
async function addFontFace(name,buf){const ff=new FontFace(name,buf);await ff.load();document.fonts.add(ff);if(!FONTS.some(f=>f[0]===name))FONTS.unshift([name,name])}

/* 글 움직임 */
function preview(pi){if(P.pages[pi].motion==='none'){toast('먼저 움직임을 골라요');return}const t0=performance.now();const f=()=>{const t=(performance.now()-t0)/1000;ANIM=makeAnim(P.pages[pi].motion,t,pi);dirty();if(t<4)requestAnimationFrame(f);else{ANIM=null;dirty()}};f()}
async function recordPage(pi){const hh=H(),c=mk(W,hh);if(!c.captureStream||!window.MediaRecorder)throw new Error('이 기기에선 동영상 만들기가 안 돼요');const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  renderPage(c,pi,1);const st=c.captureStream(30);const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{});const ch=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};const done=new Promise(r=>rec.onstop=r);rec.start(200);const t0=performance.now();
  await new Promise(res=>{const f=()=>{const t=(performance.now()-t0)/1000;renderPage(c,pi,1,{anim:makeAnim(P.pages[pi].motion,t,pi)});if(t<4.2)requestAnimationFrame(f);else res()};f()});rec.stop();await done;const type=(mt||'video/webm').split(';')[0];return new File([new Blob(ch,{type})],`카드_${String(pi+1).padStart(2,'0')}.${type.includes('mp4')?'mp4':'webm'}`,{type})}
async function saveVideo(pi){if(P.pages[pi].motion==='none'){toast('먼저 움직임을 골라요');return}toast('동영상을 만드는 중이에요 · 4초');try{const f=await recordPage(pi);openExportWith([f],'동영상이 만들어졌어요')}catch(e){toast(e.message)}}

/* ============ 찾아보기 ============ */
let brTab='style';
function openBrowse(t){brTab=t;$('#browse').classList.add('on');renderBrowse()}
$('#brClose').onclick=()=>$('#browse').classList.remove('on');
function bmToggle(key,btn){const i=ST.bm.indexOf(key);if(i>=0)ST.bm.splice(i,1);else ST.bm.push(key);saveST();btn.textContent=ST.bm.includes(key)?'★':'☆'}
function stylePreview(st){const c=mk(640,300),x=c.getContext('2d');x.fillStyle='#8e8e8e';rr(x,0,0,640,300,36);x.fill();const el=styled(st[2],st[2].text||'샘플 문장입니다');const L=layoutText(el,{pi:0,total:1});const sc=Math.min(2.2,560/L.bw,240/L.bh)*.95;el.x=0;el.y=0;x.setTransform(sc,0,0,sc,320,150);drawEl(x,el,{s:sc,h:1350,pi:0,total:3,base:null});return c}
function presetPreview(pr,pi,total){const hh=1350,s=.2,c=mk(W*s,hh*s),x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,pr.bg?pr.bg:'#9b9b9b');g.addColorStop(1,pr.bg?'#1d1d1f':'#5f5f5f');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.setTransform(s,0,0,s,0,0);const els=pr.pages[pi].map(sp=>specToEl(sp,hh));for(const el of els)drawEl(x,el,{s,h:hh,pi:Math.min(pi,total-1),total,base:null});return c}
function useStyle(st){if(!$('#editor').classList.contains('on')){startBlank().then(()=>useStyle(st));return}let el=selEl();if(el&&el.type==='text'&&!el.dyn){restyle(el,st[2])}else if(el&&el.dyn){restyle(el,st[2])}else{el=styled(st[2]);el.y=H()/2;curPg().elements.push(el);selId=el.id}$('#browse').classList.remove('on');commit(true);dirty(true);if(tool)buildPanel();toast(`'${st[1]}'를 적용했어요`)}
async function usePreset(pr){if(!$('#editor').classList.contains('on')){startBlank(pr.pages.length>1?3:1).then(()=>usePreset(pr));return}
  const has=P.pages.some(p=>p.elements.length);if(has&&!await askConfirm('지금 있는 글이 템플릿 글로 바뀌어요. 계속할까요?','바꾸기'))return;const hh=H(),apply=(pg,src)=>{pg.elements=src.map(sp=>specToEl(sp,hh));pg.grad=JSON.parse(JSON.stringify(pr.grad||{type:'black',amt:.5}));if(pr.bg&&!pg.photo)pg.bg=pr.bg};
  if(pr.pages.length===1)apply(curPg(),pr.pages[0]);else{while(P.pages.length<3)P.pages.push(newPage());const n=P.pages.length;P.pages.forEach((pg,i)=>apply(pg,i===0?pr.pages[0]:i===n-1?pr.pages[2]:pr.pages[1]))}
  selId=null;$('#browse').classList.remove('on');renderPages();commit(true);dirty(true);toast(`'${pr.name}' 템플릿을 적용했어요`)}
function renderBrowse(){const tb=$('#brTabs'),bd=$('#brBody');tb.innerHTML='';[['style','글상자 모양'],['page','페이지 프리셋'],['bm','★ 즐겨찾기']].forEach(([k,l])=>{const b=h('button','btab'+(brTab===k?' on':''),l);b.onclick=()=>{brTab=k;renderBrowse()};tb.append(b)});bd.innerHTML='';bd.scrollTop=0;
  const styleTile=st=>{const t=h('div','stile');const pv=stylePreview(st);pv.style.cursor='pointer';pv.onclick=()=>useStyle(st);const f=h('div','sfoot');f.append(h('span',null,st[1]));const bm=h('button','bm',ST.bm.includes('s:'+st[1])?'★':'☆');bm.setAttribute('aria-label','즐겨찾기');bm.onclick=()=>bmToggle('s:'+st[1],bm);f.append(bm);t.append(pv,f);return t};
  const presetTile=pr=>{const t=h('div','ptile');const tp=h('div','ptop');tp.append(h('b',null,pr.name));const bm=h('button','bm',ST.bm.includes('p:'+pr.name)?'★':'☆');bm.onclick=()=>bmToggle('p:'+pr.name,bm);tp.append(bm);const g=h('div','prev3');const labs=pr.pages.length===1?['한 장']:['표지','본문','마지막'];pr.pages.forEach((_,i)=>{const d=h('div');d.append(presetPreview(pr,i,pr.pages.length===1?1:3),h('span',null,labs[i]));g.append(d)});const u=h('button','use','이 템플릿 쓰기');u.onclick=()=>usePreset(pr);t.append(tp,g,u);return t};
  if(brTab==='style'){let last='';const cats={};STY.forEach(st=>{(cats[st[0]]=cats[st[0]]||[]).push(st)});for(const c in cats){bd.append(h('div','bcat',c));const g=h('div','sgrid');cats[c].forEach(st=>g.append(styleTile(st)));bd.append(g)}}
  else if(brTab==='page'){note2(bd,'표지·본문·마지막 세 가지 모양이 장 수에 맞게 들어가요. 첫 장은 표지, 마지막 장은 마지막, 나머지는 본문 모양이에요.');const pgd=h('div','pgrid');PRE.forEach(pr=>pgd.append(presetTile(pr)));bd.append(pgd)}
  else{const ss=STY.filter(s=>ST.bm.includes('s:'+s[1])),ps=PRE.filter(p=>ST.bm.includes('p:'+p.name));if(!ss.length&&!ps.length){note2(bd,'☆를 눌러 자주 쓰는 모양을 모아 두세요.');return}if(ss.length){bd.append(h('div','bcat','글상자 모양'));const g=h('div','sgrid');ss.forEach(st=>g.append(styleTile(st)));bd.append(g)}if(ps.length){bd.append(h('div','bcat','페이지 프리셋'));const pgd=h('div','pgrid');ps.forEach(pr=>pgd.append(presetTile(pr)));bd.append(pgd)}}}
function note2(b,t){const p=h('p','fnote',t);b.append(p)}

/* ============ 피드 미리보기 ============ */
let fdTab='post';
$('#bPrev').onclick=()=>{fdTab='post';$('#feed').classList.add('on');renderFeed()};
$('#fdClose').onclick=()=>$('#feed').classList.remove('on');
function pageURL(i,s=.5){const c=mk(W*s,H()*s);renderPage(c,i,s);return c.toDataURL('image/jpeg',.88)}
function renderFeed(){const tb=$('#fdTabs'),bd=$('#fdBody');tb.innerHTML='';[['post','게시물'],['grid','프로필 격자']].forEach(([k,l])=>{const b=h('button','btab'+(fdTab===k?' on':''),l);b.onclick=()=>{fdTab=k;renderFeed()};tb.append(b)});bd.innerHTML='';
  if(fdTab==='post'){const post=h('div','fpost'),hd=h('div','fhead'),av=h('div','fav');av.append(h('i'));const nm=h('button','fname',ST.account);nm.style.textAlign='left';nm.onclick=async()=>{const v=await askText('계정 이름',ST.account);if(v!=null){ST.account=v.replace(/^@/,'')||'계정이름';saveST();renderFeed();dirty(true)}};hd.append(av,nm,h('span',null,'•••'));const car=h('div','fcar');const urls=P.pages.map((_,i)=>pageURL(i));urls.forEach(u=>{const im=h('img');im.src=u;im.alt='';car.append(im)});const dots=h('div','fdots');urls.forEach((_,i)=>dots.append(h('i',i===0?'on':null)));car.onscroll=()=>{const i=Math.round(car.scrollLeft/car.clientWidth);[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i))};
    const ic=h('div','ficons');['♡','💬','➤'].forEach(s=>ic.append(h('span',null,s)));const cap=h('div','fcap');cap.append(h('b',null,ST.account+' '),document.createTextNode('캡션은 여기에 들어가요'));post.append(hd,car,dots,ic,cap);bd.append(post);note2(bd,'계정 이름을 누르면 바꿀 수 있어요. 옆으로 밀어서 넘겨 보세요.')}
  else{const g=h('div','fgrid');for(let i=0;i<9;i++){const d=h('div');if(i===0){const im=h('img');im.src=pageURL(0,.4);im.alt='';d.append(im)}g.append(d)}bd.append(g);note2(bd,'프로필 격자에서는 표지가 3:4로 잘려 보여요. 양옆(또는 위아래)이 잘리는지 확인하세요.')}}

/* ============ 저장 ============ */
$('#bSave').onclick=()=>openExport();$('#bShare').onclick=()=>openExport();
$('#xpClose').onclick=()=>$('#xport').classList.remove('on');
async function renderAll(){const out=[];for(let i=0;i<P.pages.length;i++){const c=mk(W,H());renderPage(c,i,1);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));out.push(new File([b],`카드_${String(i+1).padStart(2,'0')}.jpg`,{type:'image/jpeg'}))}return out}
async function openExport(){const bd=$('#xpBody');bd.innerHTML='';bd.append(h('p','fnote','이미지를 만드는 중이에요…'));$('#xport').classList.add('on');await new Promise(r=>setTimeout(r,30));const files=await renderAll();showExport(files,`${files.length}장을 만들었어요`)}
function openExportWith(files,msg){$('#xport').classList.add('on');showExport(files,msg)}
function showExport(files,msg){const bd=$('#xpBody');bd.innerHTML='';bd.append(h('p','fnote',msg+' · 1080px'));const g=h('div','xgrid');files.forEach(f=>{const u=URL.createObjectURL(f);if(f.type.startsWith('video')){const v=h('video');v.src=u;v.controls=true;v.playsInline=true;v.style.width='100%';v.style.borderRadius='10px';g.append(v)}else{const im=h('img');im.src=u;im.alt=f.name;g.append(im)}});bd.append(g);
  const canShare=!!(navigator.canShare&&(()=>{try{return navigator.canShare({files})}catch(e){return false}})());
  if(canShare){const s=h('button','bigbtn','사진 앱에 한 번에 저장하기');s.onclick=async()=>{try{await navigator.share({files})}catch(e){if(e.name!=='AbortError')toast('공유 창을 열지 못했어요. 아래 파일로 받기를 써 보세요')}};bd.append(s)}
  const d=h('button','bigbtn'+(canShare?' light':''),files.length>1?`파일로 받기 (${files.length}개)`:'파일로 받기');d.onclick=()=>saveFiles(files);bd.append(d);
  note2(bd,canShare?'공유 창에서 "이미지 저장"을 누르면 사진 앱에 순서대로 들어가요.':'이미지를 길게 눌러 "사진 앱에 저장"해도 돼요.');
  const mv=P.pages.map((p,i)=>[p,i]).filter(([p])=>p.motion!=='none');if(mv.length&&files[0].type.startsWith('image')){note2(bd,'움직임을 넣은 페이지는 동영상으로도 받을 수 있어요.');mv.forEach(([p,i])=>{const b=h('button','bigbtn light',`${i+1}번째 페이지 동영상 만들기`);b.onclick=()=>saveVideo(i);bd.append(b)})}}

let _dl;function getDL(){if(_dl!==undefined)return Promise.resolve(_dl);if(!(window.claude&&window.claude.use))return Promise.resolve(_dl=null);return window.claude.use('downloads').then(x=>_dl=x||null).catch(()=>_dl=null)}
async function saveFiles(files){const dl=await getDL();if(!dl){for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,450))}return}
  let n=0;for(const f of files){let tries=0;for(;;){try{await dl.save({filename:f.name,data:f});n++;break}catch(e){const c=e&&e.code;if(c==='rate_limited'&&tries++<4){await new Promise(r=>setTimeout(r,900));continue}if(c==='declined'){toast(n?`${n}개까지 저장했어요`:'저장을 취소했어요');return}toast('저장하지 못했어요. 이미지를 길게 눌러 저장해 주세요');return}}}toast(`${n}개를 저장했어요`)}
/* ============ 보관 (이 기기) ============ */
let DB=null;
function idb(){return new Promise((res,rej)=>{if(DB)return res(DB);if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('hanjang',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('fonts',{keyPath:'name'})};r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))}
let _sv;function scheduleSave(){clearTimeout(_sv);_sv=setTimeout(saveProject,900)}
async function saveProject(){if(!P)return;try{const used=new Set();P.pages.forEach(p=>{if(p.photo)used.add(p.photo);p.elements.forEach(e=>e.src&&used.add(e.src))});P.globals.forEach(e=>e.src&&used.add(e.src));const assets={};used.forEach(id=>{if(ASSETS[id])assets[id]=ASSETS[id]});
  const c=mk(W*.16,H()*.16);renderPage(c,0,.16);const rec={id:P.id,updated:Date.now(),count:P.pages.length,thumb:c.toDataURL('image/jpeg',.7),data:JSON.parse(snap()),assets};await tx('projects','readwrite',s=>s.put(rec))}catch(e){if(!saveProject._w){saveProject._w=1;toast('이 브라우저에선 이어하기 저장이 안 돼요')}}}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return Math.max(1,Math.round(s))+'초 전';if(s<3600)return Math.round(s/60)+'분 전';if(s<86400)return Math.round(s/3600)+'시간 전';return Math.round(s/86400)+'일 전'}
async function renderHome(){const box=$('#hResume');box.innerHTML='';let list=[];try{list=await tx('projects','readonly',s=>s.getAll())||[]}catch(e){}
  list.sort((a,b)=>b.updated-a.updated);if(list.length){const c=h('div','card');c.append(h('div','cl','이어하기'));c.firstChild.style.marginBottom='12px';const r=h('div','rlist');list.slice(0,12).forEach(p=>{const it=h('button','ritem');const im=h('img');im.src=p.thumb;im.alt='';const del=h('span','rdel','✕');del.setAttribute('role','button');del.setAttribute('aria-label','지우기');del.onclick=async e=>{e.stopPropagation();if(!await askConfirm('이 캐러셀을 지울까요?','지우기'))return;await tx('projects','readwrite',s=>s.delete(p.id));renderHome()};it.append(im,h('b',null,'이어하기'),h('small',null,`${p.count}장 · ${ago(p.updated)}`),del);it.onclick=()=>openProject(p);r.append(it)});c.append(r);box.append(c)}
  const tr=$('#hTpl');tr.innerHTML='';PRE.slice(0,8).forEach(pr=>{const b=h('button');const cv2=presetPreview(pr,0,pr.pages.length===1?1:3);b.append(cv2,h('div',null,pr.name));b.onclick=()=>usePreset(pr);tr.append(b)})}
function openProject(rec){ASSETS=Object.assign({},rec.assets);Object.keys(ASSETS).forEach(loadImg);P={id:rec.id,ratio:rec.data.ratio,pages:rec.data.pages,globals:rec.data.globals};P.pages.forEach(p=>{p.maskV=p.maskV||0;p.mask=p.mask||[]});enterEditor()}
function enterEditor(){cur=0;selId=null;tool=null;mode='normal';tab='글';HIST=[];FUT=[];baseCache.clear();$('#home').classList.remove('on');$('#editor').classList.add('on');$('#panel').classList.remove('on');renderTabs();renderTools();renderPages();commit(true);updUndo();requestAnimationFrame(layoutStage)}
async function startNew(){const fs=await pickFiles('image/*',true);if(!fs.length)return;ASSETS={};const pages=[];toast('사진을 불러오는 중이에요');for(const f of fs){try{pages.push(newPage(addAsset(await fileToData(f))))}catch(e){toast(e.message)}}if(!pages.length)return;P={id:uid(),ratio:'4:5',pages,globals:[]};enterEditor()}
async function startBlank(n=1){ASSETS={};P={id:uid(),ratio:'4:5',pages:Array.from({length:n},()=>newPage()),globals:[]};$('#browse').classList.remove('on');enterEditor()}
$('#hNew').onclick=startNew;$('#hNew2').onclick=startNew;$('#hBrowse').onclick=()=>openBrowse('style');
$('#hMore').onclick=async()=>{const v=await askText('@ 뒤에 들어갈 계정 이름',ST.account);if(v!=null){ST.account=v.replace(/^@/,'')||'계정이름';saveST();toast('계정 이름을 바꿨어요')}};
$('#bClose').onclick=async()=>{clearTimeout(_sv);await saveProject();$('#editor').classList.remove('on');$('#home').classList.add('on');P=null;closeToolSilently();renderHome()};
function closeToolSilently(){tool=null;mode='normal';hint('');$('#panel').classList.remove('on')}
$('#fAdd').onclick=()=>{const el=defText();el.y=H()/2;curPg().elements.push(el);selId=el.id;commit(true);tab='글';renderTabs();openTool('content','내용')};
$('#fDup').onclick=()=>{const el=selEl();if(!el)return;const c=JSON.parse(JSON.stringify(el));c.id=uid();c.x+=40;c.y+=40;ownerOf(el).push(c);selId=c.id;commit(true);dirty(true)};
$('#fDel').onclick=()=>{const el=selEl();if(!el)return;const a=ownerOf(el);a.splice(a.indexOf(el),1);selId=null;if(tool&&NEED_EL.has(tool))closeTool();commit(true);dirty(true)};
document.addEventListener('keydown',e=>{if(!P||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if((e.key==='Backspace'||e.key==='Delete')&&selEl())$('#fDel').click();if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();(e.shiftKey?$('#bRedo'):$('#bUndo')).click()}});

/* 시작 */
(async()=>{try{const fs=await tx('fonts','readonly',s=>s.getAll())||[];for(const f of fs){try{await addFontFace(f.name,f.buf)}catch(_){}}}catch(_){}renderHome();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!P)renderHome()})})();
</script>
