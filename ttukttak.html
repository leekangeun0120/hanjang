<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf7f2">
<title>뚝딱뚝딱 · AI 카드뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Do+Hyeon&family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#1b1a18;--sub:#8b867d;--line:#e8e2d8;--soft:#f1ece3;--acc:#ff6a3d;--accink:#ffffff;--panel:#232220;--panel2:#3a3835;--warn:#d93a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#ece6db;font-family:"Pretendard Variable","Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea,input{font:inherit;color:inherit}
#app{max-width:680px;margin:0 auto;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{display:none;flex:1;flex-direction:column;min-height:0}.view.on{display:flex}
/* 홈 */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;font-size:17px;flex:none}
.ib:disabled{opacity:.35}
.scroll{flex:1;overflow:auto;padding:4px 16px 40px;-webkit-overflow-scrolling:touch}
.lead{color:var(--sub);font-size:14.5px;line-height:1.55;margin:2px 4px 14px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 4px 14px}
.tabs button{padding:10px 0 11px;font-size:16px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs small{font-weight:500;color:var(--sub);margin-left:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg button{padding:11px 16px;border-radius:14px;background:var(--soft);font-size:15px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.pill button{border-radius:999px;padding:13px 20px}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}.seg.g3{display:grid;grid-template-columns:1fr 1fr 1fr}
.seg button small{display:block;font-weight:500;font-size:12.5px;opacity:.7;margin-top:2px}
.notice{display:flex;gap:10px;background:var(--soft);border-radius:16px;padding:12px 14px;color:var(--sub);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.sec{background:var(--card);border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line) inset}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sech i{flex:none;min-width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800}
.sech b{font-size:17.5px;letter-spacing:-.02em}.sech span{margin-left:auto;color:var(--sub);font-size:13px}
.lab{display:block;font-size:13.5px;font-weight:700;margin:12px 2px 6px}.lab small{font-weight:500;color:var(--sub)}
.hint{color:var(--sub);font-size:13px;line-height:1.5;margin:8px 2px 0}
.in,.ta{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;background:var(--soft);line-height:1.5}
.ta{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:8px 12px;border-radius:14px;background:var(--soft);font-size:14px}
.step{display:flex;align-items:center;background:var(--soft);border-radius:14px}
.step button{width:54px;height:50px;font-size:22px}.step b{flex:1;text-align:center;font-size:16px}
.filebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--soft);border-radius:14px;padding:13px;font-size:15px;color:var(--sub);text-align:left}
.filebtn.has{color:var(--ink);font-weight:600}
.big{display:block;width:100%;background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;font-size:17px;font-weight:700;margin-top:10px}
.big.light{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.big.acc{background:var(--acc);color:#fff}
.big:disabled{opacity:.5}
#prog{text-align:center;color:var(--sub);font-size:14px;line-height:1.5;min-height:22px;margin:12px 0 0}
.tprev{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.tprev canvas{flex:none;width:58%;max-width:300px;border-radius:14px;box-shadow:0 0 0 1px var(--line);scroll-snap-align:center}
.trow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}
.trow button{flex:none;width:104px;padding:4px 4px 6px;border-radius:14px;border:2.5px solid transparent;font-size:13px;color:var(--sub);position:relative}
.trow button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.trow canvas{width:100%;border-radius:9px;display:block;margin-bottom:6px;box-shadow:0 0 0 1px var(--line)}
.trow .add{border:2.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px}
.trow .add b{font-size:26px;font-weight:300;color:var(--ink)}
.del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mine button{text-align:left;position:relative}
.mine img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block;background:var(--soft);box-shadow:0 0 0 1px var(--line)}
.mine b{display:block;font-size:14px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mine small{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px;line-height:1.6}
/* 편집 */
.etop{display:flex;align-items:center;gap:8px;padding:10px 12px}
.etop .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebtn{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;flex:none}
#strip{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 6px}
.th{flex:none;text-align:center;font-size:12px;color:var(--sub)}
.th canvas{display:block;width:50px;border-radius:8px;border:2.5px solid transparent;box-shadow:0 0 0 1px var(--line);margin-bottom:4px}
.th.on{color:var(--ink);font-weight:700}.th.on canvas{border-color:var(--ink)}
.th.addp{width:50px;height:62.5px;border-radius:8px;border:2px dashed var(--line);font-size:22px;display:grid;place-items:center}
.tbar{display:flex;align-items:center;gap:2px;padding:4px 12px 8px}
.tbar b{font-size:15px}.tbar b small{color:var(--sub);font-weight:600}
.tb{height:40px;min-width:40px;padding:0 9px;border-radius:12px;display:grid;place-items:center;grid-auto-flow:column;gap:5px;font-size:14px;font-weight:600;position:relative}
.tb:disabled{opacity:.3}.tb.on{background:var(--ink);color:var(--bg)}
.tb em{position:absolute;right:0;top:0;background:var(--ink);color:var(--bg);font-style:normal;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#stagewrap{flex:1;min-height:150px;position:relative;margin:0 12px;background:#e9e3d8;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;touch-action:none}
#cv{display:block;box-shadow:0 4px 22px rgba(0,0,0,.14)}
#guides{position:absolute;inset:0;pointer-events:none}
#guides i{position:absolute;background:#e0218a}
#selbox{position:absolute;display:none;border:1.5px solid #2b7fff;pointer-events:none}
#selbox span{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid #2b7fff;pointer-events:auto;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#selbox .br{right:-11px;bottom:-11px}#selbox .r{right:-11px;top:50%;margin-top:-10px;border-radius:7px;width:12px;right:-7px}#selbox .b{bottom:-7px;left:50%;margin-left:-10px;border-radius:7px;height:12px}
#selbox em{position:absolute;right:0;top:-34px;background:#1b1a18;color:#fff;font-style:normal;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;display:none}
#panel{display:none;margin:8px 12px 0;background:var(--panel);color:#fff;border-radius:22px;padding:12px 14px 14px;max-height:36vh;overflow:auto;-webkit-overflow-scrolling:touch}
#panel.on{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#c9c5bd;font-size:14px}
.px{width:32px;height:32px;border-radius:50%;background:var(--panel2);color:#fff;font-size:14px}
.pta{width:100%;border:0;border-radius:14px;padding:12px;font-size:16px;background:#fff;color:#111;resize:vertical;min-height:84px;line-height:1.5;display:block}
.pin{width:100%;border:0;border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:#111;display:block}
.plab{color:#c9c5bd;font-size:13px;margin:10px 0 6px}
.pnote{color:#aaa59c;font-size:13px;line-height:1.5;margin:8px 0 2px;white-space:pre-line}
.pc{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0}
.pc.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.pc button{flex:none;background:var(--panel2);color:#fff;border-radius:18px;padding:9px 14px;font-size:14.5px;white-space:nowrap}
.pc button.on{background:#fff;color:#111}.pc button.go{background:var(--acc)}
.sws{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}.sw.on{outline:3px solid #fff;outline-offset:2px}
.sw.none{background:linear-gradient(135deg,#fff 45%,#e5484d 46%,#e5484d 54%,#fff 55%)}
.swc{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.swc::-webkit-color-swatch-wrapper{padding:0}.swc::-webkit-color-swatch{border:0;opacity:0}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#5d5a55}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px}
.rng::-moz-range-track{height:4px;background:#5d5a55}.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
.prow{display:flex;justify-content:space-between;color:#c9c5bd;font-size:13px}.prow b{color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.sgrid button{background:var(--panel2);border-radius:14px;padding:6px 2px;color:#fff;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sgrid canvas{width:56px;height:44px}.sgrid .emo{font-size:30px;line-height:44px;height:44px}
.lyr{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:12px;padding:5px;margin-bottom:6px}
.lyr.on{outline:2px solid #fff}.lyr b{flex:1;text-align:left;font-weight:500;font-size:14.5px;padding:6px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff}
.lyr button.s{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;flex:none}
#tools{display:flex;gap:2px;overflow-x:auto;padding:8px 8px 2px}
.tool{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0;font-size:12px;color:var(--sub)}
.tool i{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:18px;color:var(--ink)}
.tool.on{color:var(--ink);font-weight:700}.tool.on i{background:var(--ink);color:var(--bg)}
#btabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:2px 8px 8px}
#btabs button{flex:1;padding:10px 0 6px;font-size:15px;color:var(--sub);font-weight:600}
#btabs button.on{color:var(--ink);font-weight:800}
/* 시트·모달 */
.sheet{position:absolute;inset:0;z-index:30;background:rgba(20,18,15,.42);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.box{background:var(--bg);width:100%;max-width:680px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto}
.boxh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.boxh b{font-size:19px;letter-spacing:-.02em}
.opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line) inset}
.opt b{font-size:16px}.opt p{margin:6px 0 8px;color:var(--sub);font-size:13.5px;line-height:1.5}.opt span{display:inline-block;background:var(--soft);border-radius:8px;padding:4px 8px;font-size:12px;margin-right:6px;font-weight:600}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:22px;height:22px;accent-color:#1b1a18}.chk small{color:var(--sub)}.chk canvas{width:34px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line) inset;font-size:13.5px;line-height:1.5}
.cmp h4{margin:0 0 8px;font-size:16px;line-height:1.35}.cmp li{margin:0 0 6px}.cmp ol{padding-left:18px;margin:0 0 10px;color:#55524c}
.srcbox{background:var(--card);border-radius:16px;padding:14px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;box-shadow:0 0 0 1px var(--line) inset;max-height:44vh;overflow:auto}
.srcbox mark{background:#fff1a8;border-radius:3px}.addl{color:var(--warn);font-size:14px;line-height:1.6;margin:8px 2px}
.sw2{display:flex;align-items:center;gap:12px;margin:4px 2px 12px;font-size:15px}
.sw2 input{display:none}.sw2 span{flex:none;width:50px;height:30px;border-radius:15px;background:#cfc8bc;position:relative;transition:.15s;margin-left:auto}
.sw2 span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw2 input:checked+span{background:var(--ink)}.sw2 input:checked+span::after{transform:translateX(20px)}
.v3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.v3 button{font-size:13px;color:var(--sub)}.v3 canvas{width:100%;border-radius:10px;box-shadow:0 0 0 1px var(--line);margin-bottom:6px;display:block}
.xg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.xg img{width:100%;border-radius:10px;display:block}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:rgba(27,26,24,.92);color:#fff;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88%;text-align:center;line-height:1.45}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:900px) and (min-height:640px){#app{max-width:1180px}
#editor.on{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage strip" "stage tbar" "stage panel" "stage tools"}
.etop{grid-area:top}#strip{grid-area:strip;flex-wrap:wrap}.tbar{grid-area:tbar}#stagewrap{grid-area:stage;margin:0 4px 14px 14px}#panel{grid-area:panel;max-height:none;align-self:start;margin:4px 12px;max-height:100%}
#ebot{grid-area:tools;padding-bottom:8px}.scroll{max-width:720px;width:100%;margin:0 auto}}
@media (max-width:899px){#editor.popen #strip{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<section id="home" class="view on">
  <div class="top"><div class="logo"><i>뚝</i>뚝딱뚝딱</div><div class="sp"></div><button class="ib" id="bSet" aria-label="설정">⚙</button></div>
  <div class="scroll" id="homeBody"></div>
</section>
<section id="editor" class="view">
  <div class="etop"><button class="ib" id="bHome" aria-label="홈으로">⌂</button><div class="ttl" id="eTitle"></div><button class="savebtn" id="bSave">저장 ▾</button></div>
  <div id="strip"></div>
  <div class="tbar"><b id="sNum"></b><div class="sp"></div>
    <button class="tb" id="bSrc"><svg viewBox="0 0 22 22"><path d="M6 3h7l4 4v12H6zM13 3v4h4M9 12h5M9 15.5h5"/></svg>원문</button>
    <button class="tb" id="bLay" aria-label="레이어"><svg viewBox="0 0 22 22"><path d="M11 3l8 4.5-8 4.5-8-4.5zM3 11.5l8 4.5 8-4.5M3 15l8 4.5 8-4.5"/></svg><em id="layN">0</em></button>
    <button class="tb" id="bDel" aria-label="삭제"><svg viewBox="0 0 22 22"><path d="M4 6h14M9 6V4h4v2M6 6l1 13h8l1-13M9.5 10v6M12.5 10v6"/></svg></button>
    <button class="tb" id="bDup" aria-label="복제"><svg viewBox="0 0 22 22"><rect x="7" y="7" width="11" height="11" rx="2"/><path d="M4 14V5a1 1 0 011-1h9"/></svg></button>
    <button class="tb" id="bUndo" aria-label="되돌리기"><svg viewBox="0 0 22 22"><path d="M8 5L4 9l4 4"/><path d="M4 9h9a5 5 0 010 10h-3"/></svg></button>
    <button class="tb" id="bRedo" aria-label="다시하기"><svg viewBox="0 0 22 22"><path d="M14 5l4 4-4 4"/><path d="M18 9H9a5 5 0 000 10h3"/></svg></button>
  </div>
  <div id="stagewrap"><div id="stage"><canvas id="cv"></canvas><div id="guides"></div><div id="selbox"><em></em><span class="r" data-h="r"></span><span class="b" data-h="b"></span><span class="br" data-h="br"></span></div></div></div>
  <div id="panel"></div>
  <div id="ebot"><div id="tools"></div><div id="btabs"></div></div>
</section>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>
</div>
<script>
'use strict';
/* ============ 기본 ============ */
const W=1080,H=1350,GAPI='https://generativelanguage.googleapis.com';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function mk(w,hh){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(hh));return c}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ST=Object.assign({acct:'',nick:'',intro:'',avatar:'',key:'',model:'',mytpl:[],mycount:0,form:{}},store.get('tk_set',{}));
const saveST=()=>store.set('tk_set',ST);

    r.append(n,mkb('▲','앞으로',()=>{if(i<els.length-1){els.splice(i,1);els.splice(i+1,0,e)}}),mkb('▼','뒤로',()=>{if(i>0){els.splice(i,1);els.splice(i-1,0,e)}}),mkb(e.hide?'🙈':'👁','보이기·숨기기',()=>{e.hide=e.hide?0:1;if(e.hide&&sel===e.id)sel=null}),mkb(e.lock?'🔒':'🔓','잠그기·풀기',()=>{e.lock=e.lock?0:1;if(e.lock&&sel===e.id)sel=null}));b.append(r)});note(b,'위에 있는 것이 앞에 보여요. 잠근 것은 화면에서 눌러도 잡히지 않아요.')}};

/* ============ 저장 ============ */
$('#bSave').onclick=()=>sheet(b=>{sheetHead(b,'저장');const add=(t,d,fn)=>{const o=h('button','opt');o.append(h('b',null,t),h('p',null,d));o.lastChild.style.marginBottom='0';o.onclick=fn;b.append(o)};
  add('PNG로 저장','페이지를 골라 1080×1350 이미지로 받아요.',()=>pageSelect('png'));add('JPG로 저장','용량이 작은 이미지로 받아요.',()=>pageSelect('jpg'));add('영상으로 저장','모든 장을 차례로 넘기는 슬라이드 영상으로 받아요. 릴스에 올릴 때 써요.',saveVideo);
  add('캡션 복사',P.caption?P.caption.slice(0,60)+'…':'아직 캡션이 없어요. AI → 캡션에서 만들 수 있어요.',()=>{if(P.caption){copyText(P.caption,'캡션을 복사했어요');closeSheet()}else toast('캡션이 없어요')});b.append(h('p','hint','작업은 이 기기에 자동으로 보관돼요. 홈 → 내 카드뉴스에서 다시 열 수 있어요.'))});
function pageSelect(fmt){const on=P.slides.map(()=>true);sheet(b=>{sheetHead(b,'페이지 선택');const all=h('label','chk'),ai=h('input');ai.type='checkbox';ai.checked=true;all.append(ai,h('b',null,'모든 페이지'));b.append(all);const boxes=[];
  P.slides.forEach((sl,i)=>{const l=h('label','chk'),c=h('input');c.type='checkbox';c.checked=true;c.onchange=()=>{on[i]=c.checked;ai.checked=on.every(Boolean);upd()};boxes.push(c);const sp=h('span',null,`${i+1} 페이지 `);sp.append(h('small',null,KIND[sl.kind]||'본문'));sp.style.flex='1';l.append(renderSlide(sl,i,P.slides.length,.07,{exp:1}),sp,c);b.append(l)});
  ai.onchange=()=>{on.fill(ai.checked);boxes.forEach(c=>c.checked=ai.checked);upd()};const go=h('button','big');const upd=()=>{const n=on.filter(Boolean).length;go.textContent=`${fmt.toUpperCase()} ${n}장 다운로드`;go.disabled=!n};upd();
  go.onclick=async()=>{go.disabled=true;go.textContent='이미지를 만드는 중이에요…';await loadFonts(P.tpl,JSON.stringify(P.slides));const files=[];for(let i=0;i<P.slides.length;i++){if(!on[i])continue;const c=renderSlide(P.slides[i],i,P.slides.length,1,{exp:1}),bl=await new Promise(r=>c.toBlob(r,fmt==='png'?'image/png':'image/jpeg',.95));files.push(new File([bl],`카드_${String(i+1).padStart(2,'0')}.${fmt}`,{type:bl.type}))}exportSheet(files)};b.append(go)})}
function exportSheet(files){sheet(b=>{sheetHead(b,`${files.length}개를 만들었어요`);const vid=files[0].type.startsWith('video');if(vid){const v=h('video');v.src=URL.createObjectURL(files[0]);v.controls=true;v.playsInline=true;v.style.cssText='width:100%;border-radius:14px;max-height:50vh;background:#000';b.append(v)}
  else{const g=h('div','xg');files.forEach(f=>{const im=h('img');im.src=URL.createObjectURL(f);im.alt=f.name;g.append(im)});b.append(g)}
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files}))}catch(e){}
  if(can){const s=h('button','big','사진 앱에 저장 · 공유');s.onclick=async()=>{try{await navigator.share({files})}catch(e){if(e.name!=='AbortError')toast('공유 창을 열지 못했어요. 파일로 받기를 써 보세요')}};b.append(s)}
  const d=h('button','big'+(can?' light':''),files.length>1?`파일로 받기 (${files.length}개)`:'파일로 받기');d.onclick=()=>download(files);b.append(d);b.append(h('p','hint',vid?'영상이 재생되지 않으면 파일로 받아서 확인해 주세요.':'이미지를 길게 눌러 저장해도 돼요.'))})}
async function saveVideo(){const c=mk(W,H),x=c.getContext('2d');if(!c.captureStream||!window.MediaRecorder){toast('이 브라우저에서는 영상 저장이 안 돼요');return}
  const type=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type){toast('이 브라우저에서는 영상 저장이 안 돼요');return}
  $('#sheet')._hold=1;sheet(b=>{b.append(h('b',null,'영상을 만드는 중이에요…'),h('p','hint','장마다 3초씩 보여 줘요. 화면을 닫지 말고 기다려 주세요.'));b.firstChild.style.fontSize='17px'});
  try{await loadFonts(P.tpl,JSON.stringify(P.slides));const imgs=P.slides.map((s,i)=>renderSlide(s,i,P.slides.length,1,{exp:1})),HOLD=2600,FADE=400,per=HOLD+FADE,total=imgs.length*per-FADE+300;x.drawImage(imgs[0],0,0);
    const rec=new MediaRecorder(c.captureStream(30),{mimeType:type,videoBitsPerSecond:6e6}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();const t0=performance.now();
    await new Promise(res=>{const tick=()=>{const t=performance.now()-t0,i=Math.min(imgs.length-1,Math.floor(t/per)),loc=t-i*per;x.globalAlpha=1;x.drawImage(imgs[i],0,0);if(loc>HOLD&&i<imgs.length-1){x.globalAlpha=(loc-HOLD)/FADE;x.drawImage(imgs[i+1],0,0);x.globalAlpha=1}t<total?setTimeout(tick,33):res()};tick()});
    rec.stop();await done;const ext=type.includes('mp4')?'mp4':'webm';$('#sheet')._hold=0;exportSheet([new File(chunks,`카드뉴스_영상.${ext}`,{type:type.split(';')[0]})])}
  catch(e){$('#sheet')._hold=0;closeSheet();toast('영상을 만들지 못했어요')}}

/* 시작 */
renderHome();loadFonts().then(()=>{if(!P)rerender()});

</script>
